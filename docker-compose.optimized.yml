# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.optimized.yml up -d --build
#
# Port 8081, healthcheck, container_name, networks, environment KEYCLOAK_ADMIN* and
# volume mount for imports are inherited from docker-compose.yml.

services:
  keycloak:
    image: lf4a/keycloak:optimized
    build:
      context: ./keycloak
      dockerfile: Containerfile
    command:
      - start
      - --optimized
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # DB (runtime values; KC_DB itself is baked at build time).
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      # HTTP for local dev — keep identical contract with the frontend.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Heap sized relative to the container memory limit below.
      JAVA_OPTS_APPEND: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40"
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Explicit memory budget. Tune after measuring.
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - keycloak
      - backend
      - keycloak-db

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak} -d ${KC_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    mem_reservation: 128m
    networks:
      - keycloak-db

volumes:
  keycloak-db-data:

networks:
  keycloak-db: