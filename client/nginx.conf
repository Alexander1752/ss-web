limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=1r/s;
server_tokens off;
 
client_max_body_size    10m;
client_body_timeout     10s;
client_header_timeout   10s;
 
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
 
ssl_stapling        on;
ssl_stapling_verify on;
resolver            1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout    5s;


server {
    listen      80;
    server_name lf4a.com www.lf4a.com;
 
    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    http2  on;
 
    server_name lf4a.com www.lf4a.com;
    root        /usr/share/nginx/html;
    index       index.html;
 

    ssl_certificate           /etc/ssl/certs/crt.pem;
    ssl_certificate_key       /etc/ssl/certs/key.pem;
    ssl_trusted_certificate   /etc/ssl/certs/ca.pem;
 
    location / {
        try_files $uri $uri/ /index.html;
        limit_req zone=general burst=50 nodelay;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0zZPgsifJ8h8aM+gmSxkrfNtAGUZb7ItVug6/j1UR5g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://minio.lf4a.com; connect-src 'self' https://api.lf4a.com https://auth.lf4a.com https://minio.lf4a.com; font-src 'self'; object-src 'none'; frame-ancestors 'self';" always;
    }
 

    location /api/ {
        proxy_pass https://api.lf4a.com:5000/;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
 

        proxy_ssl_verify             on;
        proxy_ssl_server_name        on;
        proxy_ssl_name               api.lf4a.com;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca.pem;
        proxy_ssl_protocols          TLSv1.2 TLSv1.3;
 

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
 

        limit_req zone=general burst=20 nodelay;
    }
 

    location /auth/ {
        proxy_pass https://auth.lf4a.com:8443;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
 

        proxy_ssl_verify              on;
        proxy_ssl_server_name         on;
        proxy_ssl_name                auth.lf4a.com;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca.pem;
        proxy_ssl_protocols           TLSv1.2 TLSv1.3;
 

        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    10s;
 

        limit_req zone=auth burst=25 nodelay;
    }
 

    location /storage/ {
        proxy_pass https://minio.lf4a.com:9000/;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
 

        proxy_set_header Host              minio.lf4a.com:9000;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
 

        proxy_ssl_verify              on;
        proxy_ssl_server_name         on;
        proxy_ssl_name                minio.lf4a.com;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca.pem;
        proxy_ssl_protocols           TLSv1.2 TLSv1.3;
 

        client_max_body_size 100m;
 

        proxy_connect_timeout  5s;
        proxy_read_timeout    120s;
        proxy_send_timeout     60s;
 

        limit_req zone=general burst=30 nodelay;
    }
 
    location ~ /\. {
        deny all;
        return 404;
    }
}
